<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The policy a VS Code webview is given: nothing loads unless it is named here, scripts,
      styles, fonts and the icon come from the site's own files, as a webview's come from its
      extension's, the styles the editor adds need the nonce, and there is no inline style
      attribute or eval. Code that would fail in VS Code fails on this page first.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'nonce-{{nonce}}'; font-src 'self'; img-src 'self' data: https:"
    />
    <title>Sigil demo</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="main.css" />
    <script type="module" src="main.js" nonce="{{nonce}}"></script>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="name">Sigil</span>
        <span class="tagline">A live-preview Markdown editor</span>
      </div>
      <div class="controls">
        <label class="field">
          <span class="caption">Document</span>
          <select id="sample"></select>
        </label>
        <fieldset class="segmented" id="theme">
          <legend class="caption">Theme</legend>
          <label
            ><input type="radio" name="theme" value="system" checked /><span
              >System</span
            ></label
          >
          <label
            ><input type="radio" name="theme" value="light" /><span
              >Light</span
            ></label
          >
          <label
            ><input type="radio" name="theme" value="dark" /><span
              >Dark</span
            ></label
          >
        </fieldset>
        <fieldset class="segmented" id="reveal">
          <legend class="caption">Reveal</legend>
          <label
            ><input type="radio" name="reveal" value="line" checked /><span
              >Line</span
            ></label
          >
          <label
            ><input type="radio" name="reveal" value="construct" /><span
              >Construct</span
            ></label
          >
        </fieldset>
        <label class="switch"
          ><input type="checkbox" id="numbers" checked /> Line numbers</label
        >
        <label class="switch"
          ><input type="checkbox" id="changes" checked /> Changes</label
        >
      </div>
      <a class="source" href="https://github.com/RKeelan/Sigil"
        >Source on GitHub</a
      >
    </header>
    <main id="editor"></main>
  </body>
</html>
