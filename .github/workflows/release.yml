name: Release

# Publishes a GitHub Release for a version tag. The tag has to name the version in package.json, and
# the release is made only once the same checks as CI pass on the tagged commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against package.json
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json's version, $version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Lint package.json
        run: bun run lint:pkg

      - name: Check formatting
        run: bun fmt --check

      - name: Type check
        run: bun check

      - name: Test
        run: bun test

      - name: Build the demo site
        run: bun run build:demo

      - name: Install the browser
        run: bunx playwright install --with-deps chromium

      - name: Test in the browser
        run: bun run test:e2e

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
