name: Pages

# Publishes the demo site to GitHub Pages. The repository's Pages source has to be set to
# "GitHub Actions" for the deployment to be accepted. The jobs are skipped while the repository is
# private.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# The site is uploaded in one job and deployed in another. In a single job, deploy-pages looks for
# the artifact straight after the upload and often doesn't find it yet
# (https://github.com/actions/deploy-pages/issues/451).
jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the demo site
        run: bun run build:demo

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
